[project]
name = "on-device-speech-to-speech-conversational-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mem0ai>=0.1.0",
  "numpy>=2.5.1",
  "onnx-asr[hub]>=0.12.0",
  "onnxruntime-gpu==1.22.0",
  "pyaudio>=0.2.14",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.32",
  "requests>=2.34.2",
  "scipy>=1.18.0",
  "sounddevice>=0.5.5",
  "soundfile>=0.14.0",
  "textual>=8.2.8",
  "torch>=2.13.0",
  "twitch-python>=0.0.20",
  "vadersentiment>=3.3.2",
]


[tool.pyrefly]
search_path = ["."]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
