[project]
name = "on-device-speech-to-speech-conversational-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.5.1",
  "pyannote-audio>=4.0.7",
  "pyaudio>=0.2.14",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.32",
  "requests>=2.34.2",
  "scipy>=1.18.0",
  "sounddevice>=0.5.5",
  "soundfile>=0.14.0",
  "textual>=8.2.8",
  "torch>=2.13.0",
  "torch-audiomentations>=0.12.0",
  "transformers>=5.14.1",
  "twitch-python>=0.0.20",
]


[tool.pyrefly]
search_path = ["."]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
]
